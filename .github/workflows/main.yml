name: Generate Windows Release

on:
  push:
    branches: [ ApolloVibeC ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout Repository with Submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up MSYS2 Environment & Dependencies
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          location: 'C:\msys64'
          update: true
          install: >-
            base-devel
            mingw-w64-ucrt-x86_64-git
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-openssl
            mingw-w64-ucrt-x86_64-boost
            mingw-w64-ucrt-x86_64-opus
            mingw-w64-ucrt-x86_64-ffmpeg
            mingw-w64-ucrt-x86_64-miniupnpc
            mingw-w64-ucrt-x86_64-cppwinrt
            mingw-w64-ucrt-x86_64-curl-winssl
            mingw-w64-ucrt-x86_64-qt6-static
            mingw-w64-ucrt-x86_64-MinHook
            mingw-w64-ucrt-x86_64-nodejs

      - name: Configure CMake Build
        shell: bash
        env:
          CC: /ucrt64/bin/gcc.exe
          CXX: /ucrt64/bin/g++.exe
          PATH: /ucrt64/bin:/usr/local/bin:/usr/bin:/bin:$PATH
        run: |
          mkdir -p build
          cd build
          cmake .. -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=/ucrt64/bin/gcc.exe \
            -DCMAKE_CXX_COMPILER=/ucrt64/bin/g++.exe \
            -DCMAKE_RC_COMPILER=/ucrt64/bin/windres.exe

      - name: Compile ApolloVibe (Sunshine Host)
        shell: bash
        env:
          CC: /ucrt64/bin/gcc.exe
          CXX: /ucrt64/bin/g++.exe
          PATH: /ucrt64/bin:/usr/local/bin:/usr/bin:/bin:$PATH
        run: |
          cd build
          ninja sunshine
