name: Generate Windows Release

on:
  push:
    branches: [ ApolloVibeC ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install MSYS2 toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja

      - name: Configure build directory
        shell: cmd
        run: |
          call build_apollovibe_rebase.bat

      - name: Package ApolloVibe portable release
        shell: cmd
        run: |
          if "%GITHUB_REF_NAME%"=="" (
            set "VERSION=dev-build"
          ) else (
            set "VERSION=%GITHUB_REF_NAME%"
          )
          call package_apollovibe.bat "%VERSION%"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: apollovibe-windows-portable
          path: |
            apollovibe-windows-x64.zip
            build_apollovibe.log
          if-no-files-found: error
          retention-days: 14
