name: Generate Windows Release

on:
  push:
    branches: [ ApolloVibeMerged ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build ApolloVibe Custom (Windows x64)
    runs-on: windows-latest
    
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout Repository with Submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up MSYS2 Environment & Dependencies
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          path-type: inherit
          install: >-
            git
            make
            msys/make
            base-devel
            pkg-config
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-x264
            mingw-w64-ucrt-x86_64-git
            mingw-w64-ucrt-x86_64-make
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-openssl
            mingw-w64-ucrt-x86_64-boost
            mingw-w64-ucrt-x86_64-opus
            mingw-w64-ucrt-x86_64-ffmpeg
            mingw-w64-ucrt-x86_64-miniupnpc
            mingw-w64-ucrt-x86_64-cppwinrt
            mingw-w64-ucrt-x86_64-curl-winssl
            mingw-w64-ucrt-x86_64-qt6-static
            mingw-w64-ucrt-x86_64-MinHook
            mingw-w64-ucrt-x86_64-nodejs
            mingw-w64-ucrt-x86_64-nasm
            mingw-w64-ucrt-x86_64-yasm
            mingw-w64-ucrt-x86_64-libvpl
            mingw-w64-ucrt-x86_64-svt-av1
            mingw-w64-ucrt-x86_64-amf-headers

      - name: Explicitly Initialize and Fix Nested Submodules (LizardByte Build-Deps)
        shell: msys2 {0}
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
          git submodule update --init --recursive --force --verbose
          if [ -d "third-party/build-deps" ]; then
            cd third-party/build-deps
            git submodule update --init --recursive --force --verbose
            
            if [ -d ".git" ]; then
              mkdir -p .git/modules/third-party/FFmpeg/x264/info
              if [ -f ".gitattributes" ]; then
                cp .gitattributes .git/modules/third-party/FFmpeg/x264/info/attributes
              fi
            fi
            
            if [ -d "third-party/FFmpeg/x264" ]; then
              cd third-party/FFmpeg/x264
              git checkout --force HEAD -- .
              git clean -fdx
            fi
          fi

      - name: Sanitize MSYS2 Environment Paths
        shell: pwsh
        run: |
          $envPath = [Environment]::GetEnvironmentVariable("PATH", "Process")
          $cleanedPath = $envPath -replace 'msys64\\msys64', 'msys64' -replace 'msys64/msys64', 'msys64'
          [Environment]::SetEnvironmentVariable("PATH", $cleanedPath, "Process")
          Write-Host "Successfully sanitized PATH environment variable."

      - name: Ensure NPM CLI Path Compatibility for CMake
        shell: pwsh
        run: |
          $targetDir = "C:/msys64/ucrt64/lib/node_modules/npm/bin"
          if (-not (Test-Path $targetDir)) {
              New-Item -ItemType Directory -Force -Path $targetDir | Out-Null
          }
          $found = Get-ChildItem -Path "C:\", "D:\" -Filter "npm-cli.js" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($found) {
              Write-Host "Copying npm-cli.js from $($found.FullName) to $targetDir"
              Copy-Item -Path $found.FullName -Destination "$targetDir/npm-cli.js" -Force
          } else {
              Write-Warning "npm-cli.js source not found yet; creating placeholder structure."
              Set-Content -Path "$targetDir/npm-cli.js" -Value ""
          }

      - name: Build Dependencies Locally (FFmpeg/Build-Deps)
        shell: msys2 {0}
        env:
          MSYS2_PATH_TYPE: inherit
        run: |
          export PATH="/ucrt64/bin:/usr/bin:/bin:$PATH"
          export PKG_CONFIG="/ucrt64/bin/pkg-config"
          export PKG_CONFIG_PATH="$(cygpath -u /ucrt64/lib/pkgconfig):$(cygpath -u /ucrt64/share/pkgconfig)"
          
          export CC=/ucrt64/bin/gcc.exe
          export CXX=/ucrt64/bin/g++.exe
          export AR=/ucrt64/bin/ar.exe
          export RANLIB=/usr/bin/ranlib.exe
          export MAKE=/usr/bin/make
          
          mkdir -p /tmp
          export TMPDIR="/tmp"
          export TMP="/tmp"
          export TEMP="/tmp"
          export GITHUB_WORKSPACE_POSIX=$(cygpath -u "$GITHUB_WORKSPACE")
          
          cd "$GITHUB_WORKSPACE_POSIX"
          rm -rf third-party/build-deps/build
          mkdir -p third-party/build-deps/build
          mkdir -p third-party/build-deps/dist/Windows-AMD64
          
          cmake -S third-party/build-deps -B third-party/build-deps/build \
          -G "MSYS Makefiles" \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_INSTALL_PREFIX="$(cygpath -m "$GITHUB_WORKSPACE/third-party/build-deps/dist/Windows-AMD64")" \
          -DCMAKE_PREFIX_PATH="/ucrt64" \
          -DCMAKE_C_COMPILER=/ucrt64/bin/gcc.exe \
          -DCMAKE_CXX_COMPILER=/ucrt64/bin/g++.exe \
          -DCMAKE_AR=/ucrt64/bin/ar.exe \
          -DCMAKE_RANLIB=/usr/bin/ranlib.exe \
          -DBUILD_FFMPEG_SVT_AV1=ON \
          -DMSYS2_OPTION=2
          
          cmake --build third-party/build-deps/build --config Release --parallel 2
          cmake --install third-party/build-deps/build

          # Universal fallback: find and copy all compiled static archives (.a) into the dist library directory
          mkdir -p third-party/build-deps/dist/Windows-AMD64/lib
          find third-party/build-deps/build -name "*.a" -exec cp -f {} third-party/build-deps/dist/Windows-AMD64/lib/ \;

          # Recursive & Structure-Preserving Header Sync: Copy all nested internal headers (like x86/asm.h) into isolated subdirectories
          echo "Safely syncing nested internal and generated FFmpeg headers..."
          for lib in libavcodec libavutil libavformat libswscale libswresample libavdevice libavfilter; do
            target_dir="third-party/build-deps/dist/Windows-AMD64/include/$lib"
            mkdir -p "$target_dir"
            
            # Recursively copy all .h files from source tree preserving directory structure (e.g. x86/)
            find . -type d -name "$lib" | grep -v "dist" | while read -r src_dir; do
              if [ -d "$src_dir" ]; then
                cd "$src_dir"
                find . -name "*.h" -exec cp --parents -f {} "$(cygpath -u "$GITHUB_WORKSPACE/$target_dir")/" 2>/dev/null || true
                cd - > /dev/null
              fi
            done
            
            # Copy generated headers from build tree matching this lib
            find third-party/build-deps/build -name "*.h" | while read -r h_file; do
              if [[ "$h_file" == *"/$lib/"* ]]; then
                cp -f "$h_file" "$target_dir/" 2>/dev/null || true
              fi
            done
          done

          # Ensure generated config.h and avconfig.h are present locally inside each library include subfolder
          find third-party/build-deps/build -name "config.h" -o -name "avconfig.h" | while read -r cfg_file; do
            for lib in libavcodec libavutil libavformat libswscale libswresample libavdevice libavfilter; do
              target_dir="third-party/build-deps/dist/Windows-AMD64/include/$lib"
              if [ -d "$target_dir" ]; then
                cp -f "$cfg_file" "$target_dir/" 2>/dev/null || true
              fi
            done
          done

      - name: Configure CMake Build
        shell: msys2 {0}
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Compile ApolloVibe (Sunshine Host)
        shell: msys2 {0}
        run: |
          cd build
          ninja -j2 sunshine

      - name: Package Windows Artifacts & Generate Checksums
        shell: pwsh
        run: |
          $distDir = "dist/apollovibe-windows-x64"
          if (Test-Path "dist") { Remove-Item -Recurse -Force "dist" }
          New-Item -ItemType Directory -Force -Path $distDir | Out-Null
          
          if (Test-Path "build/sunshine.exe") { Copy-Item "build/sunshine.exe" -Destination "$distDir/" -Force }
          if (Test-Path "assets") { Copy-Item -Recurse -Force "assets" -Destination "$distDir/" }
          if (Test-Path "tools") { Copy-Item -Recurse -Force "tools" -Destination "$distDir/" }
          
          if (Test-Path "apollovibe-windows-x64.zip") { Remove-Item "apollovibe-windows-x64.zip" }
          Compress-Archive -Path "$distDir" -DestinationPath "apollovibe-windows-x64.zip"
          
          $hashObj = Get-FileHash -Path "apollovibe-windows-x64.zip" -Algorithm SHA256
          $hashStr = $hashObj.Hash.ToLower()
          "$hashStr  apollovibe-windows-x64.zip" | Out-File -Encoding ascii "apollovibe-windows-x64.zip.sha256"
          
          Write-Host "--- Generated Checksum ---"
          Get-Content "apollovibe-windows-x64.zip.sha256"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: apollovibe-windows-x64-release
          path: |
            apollovibe-windows-x64.zip
            apollovibe-windows-x64.zip.sha256
