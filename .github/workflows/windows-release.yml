name: Generate Windows Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
  pull_request:

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-2022
    timeout-minutes: 90

    defaults:
      run:
        shell: msys2 {0}

    env:
      MSYSTEM: UCRT64
      CHERE_INVOKING: 1
      BUILD_TYPE: Release

    steps:
      - name: Checkout source and submodules
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          lfs: true

      - name: Verify build-deps and FFmpeg bundle
        shell: bash
        run: |
          set -euxo pipefail

          echo "Syncing and updating submodules..."
          git submodule sync --recursive
          git submodule update --init --recursive --checkout

          echo "Submodule status:"
          git submodule status --recursive || true

          echo "Check third-party directory:"
          ls -la third-party || true
          ls -la third-party/build-deps || true
          ls -la third-party/build-deps/dist || true

          if [ ! -d "third-party/build-deps" ]; then
            echo "ERROR: third-party/build-deps is missing."
            exit 1
          fi

          if [ ! -d "third-party/build-deps/dist" ]; then
            echo "ERROR: third-party/build-deps/dist is missing."
            exit 1
          fi

          if [ ! -d "third-party/build-deps/dist/Windows-AMD64" ]; then
            echo "ERROR: missing FFmpeg bundle directory: third-party/build-deps/dist/Windows-AMD64"
            find third-party/build-deps -maxdepth 3 -type d | sort || true
            exit 1
          fi

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            make
            msys/make
            base-devel
            pkg-config
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-x264
            mingw-w64-ucrt-x86_64-git
            mingw-w64-ucrt-x86_64-make
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-openssl
            mingw-w64-ucrt-x86_64-curl
            mingw-w64-ucrt-x86_64-sqlite3
            mingw-w64-ucrt-x86_64-libminiupnpc
            mingw-w64-ucrt-x86_64-ffmpeg
          path-type: inherit
          cache: true

      - name: Confirm FFmpeg bundle exists
        shell: bash
        run: |
          set -euxo pipefail
          echo "PATH=$PATH"

          if [ -f "/ucrt64/lib/libavcodec.a" ] && [ -f "/ucrt64/lib/libswscale.a" ]; then
            echo "Using system FFmpeg bundle from MSYS2."
          else
            echo "No local FFmpeg bundle detected in /ucrt64/lib"
          fi

          echo "Checking expected build-deps folder again:"
          find third-party/build-deps -maxdepth 3 -type d 2>/dev/null | head -200

      - name: Configure CMake
        shell: bash
        env:
          PATH: /usr/bin:/bin:/ucrt64/bin:$PATH
        run: |
          set -euxo pipefail

          cmake -S . -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Build project
        shell: bash
        env:
          PATH: /usr/bin:/bin:/ucrt64/bin:$PATH
        run: |
          set -euxo pipefail
          cmake --build build --parallel
