name: Generate Windows Release

on:
  push:
    branches: [ ApolloVibeMerged ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build ApolloVibe Custom (Windows x64)
    runs-on: windows-latest
    
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout Repository with Submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up MSYS2 Environment & Dependencies
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          path-type: inherit
          install: >-
            git
            make
            msys/make
            base-devel
            pkg-config
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-binutils
            mingw-w64-ucrt-x86_64-x264
            mingw-w64-ucrt-x86_64-git
            mingw-w64-ucrt-x86_64-make
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-openssl
            mingw-w64-ucrt-x86_64-boost
            mingw-w64-ucrt-x86_64-opus
            mingw-w64-ucrt-x86_64-ffmpeg
            mingw-w64-ucrt-x86_64-miniupnpc
            mingw-w64-ucrt-x86_64-cppwinrt
            mingw-w64-ucrt-x86_64-curl-winssl
            mingw-w64-ucrt-x86_64-qt6-static
            mingw-w64-ucrt-x86_64-MinHook
            mingw-w64-ucrt-x86_64-nodejs
            mingw-w64-ucrt-x86_64-nasm
            mingw-w64-ucrt-x86_64-yasm
            mingw-w64-ucrt-x86_64-libvpl
      - name: Explicitly Initialize and Fix Nested Submodules (LizardByte Build-Deps)
        shell: msys2 {0}
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
          git submodule update --init --recursive --force --verbose
          if [ -d "third-party/build-deps" ]; then
            cd third-party/build-deps
            git submodule update --init --recursive --force --verbose
            
            if [ -d ".git" ]; then
              mkdir -p .git/modules/third-party/FFmpeg/x264/info
              if [ -f ".gitattributes" ]; then
                cp .gitattributes .git/modules/third-party/FFmpeg/x264/info/attributes
              fi
            fi
            
            if [ -d "third-party/FFmpeg/x264" ]; then
              cd third-party/FFmpeg/x264
              git checkout --force HEAD -- .
              git clean -fdx
            fi
          fi
      - name: Sanitize MSYS2 Environment Paths
        shell: pwsh
        run: |
          $envPath = [Environment]::GetEnvironmentVariable("PATH", "Process")
          $cleanedPath =$envPath -replace 'msys64\\msys64', 'msys64' -replace 'msys64/msys64', 'msys64'
          [Environment]::SetEnvironmentVariable("PATH", $cleanedPath, "Process")
          Write-Host "Successfully sanitized PATH environment variable."
      - name: Ensure NPM CLI Path Compatibility for CMake
        shell: pwsh
        run: |
          $targetDir = "C:/msys64/ucrt64/lib/node_modules/npm/bin"
          if (-not (Test-Path $targetDir)) {
              New-Item -ItemType Directory -Force -Path $targetDir | Out-Null
          }
          $found = Get-ChildItem -Path "C:\", "D:\" -Filter "npm-cli.js" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($found) {
              Write-Host "Copying npm-cli.js from $($found.FullName) to$targetDir"
              Copy-Item -Path $found.FullName -Destination "$targetDir/npm-cli.js" -Force
          } else {
              Write-Warning "npm-cli.js source not found yet; creating placeholder structure."
              Set-Content -Path "$targetDir/npm-cli.js" -Value ""
          }
      - name: Fix Windows System32 Bash WSL Stub Conflict
        shell: pwsh
        run: |
          $target = "C:\Windows\System32\bash.exe"
          $source = "C:\msys64\usr\bin\bash.exe"
          if (Test-Path $source) {
              Write-Host "Replacing WSL bash.exe stub with MSYS2 bash..."
              takeown /f $target
              icacls $target /grant "Administrators:F"
              Remove-Item -Force $target -ErrorAction SilentlyContinue
              Copy-Item -Path $source -Destination$target -Force
              Write-Host "Successfully replaced System32 bash.exe"
          } else {
              Write-Warning "MSYS2 bash.exe not found at $source"
          }
      - name: Build Dependencies Locally (FFmpeg/Build-Deps)
        shell: msys2 {0}
        env:
          MSYS2_PATH_TYPE: inherit
        run: |
          export PATH="/ucrt64/bin:/usr/bin:/bin:$PATH"
          export PKG_CONFIG="/ucrt64/bin/pkg-config"
          export PKG_CONFIG_PATH="$(cygpath -u /ucrt64/lib/pkgconfig):$(cygpath -u /ucrt64/share/pkgconfig)"
          
          export CC=/ucrt64/bin/gcc.exe
          export CXX=/ucrt64/bin/g++.exe
          
          # Create path-translating wrappers for ar and ranlib, strip CRLF, and ensure proper execution
          cat << 'EOF' > /tmp/ar-wrap.sh
          #!/bin/bash
          new_args=()
          for arg in "$@"; do
            if [[ "$arg" =~ ^/[a-zA-Z]/ ]]; then
              new_args+=("$(cygpath -w "$arg")")
            else
              new_args+=("$arg")
            fi
          done
          exec /ucrt64/bin/ar.exe "${new_args[@]}"
          EOF
          tr -d '\r' < /tmp/ar-wrap.sh > /tmp/ar-wrap2.sh && mv /tmp/ar-wrap2.sh /tmp/ar-wrap.sh
          chmod +x /tmp/ar-wrap.sh

          cat << 'EOF' > /tmp/ranlib-wrap.sh
          #!/bin/bash
          new_args=()
          for arg in "$@"; do
            if [[ "$arg" =~ ^/[a-zA-Z]/ ]]; then
              new_args+=("$(cygpath -w "$arg")")
            else
              new_args+=("$arg")
            fi
          done
          exec /ucrt64/bin/ranlib.exe "${new_args[@]}"
          EOF
          tr -d '\r' < /tmp/ranlib-wrap.sh > /tmp/ranlib-wrap2.sh && mv /tmp/ranlib-wrap2.sh /tmp/ranlib-wrap.sh
          chmod +x /tmp/ranlib-wrap.sh

          export AR="/tmp/ar-wrap.sh"
          export RANLIB="/tmp/ranlib-wrap.sh"
          export MAKE=make
          
          mkdir -p /tmp/deps-tmp
          export TMPDIR="/tmp/deps-tmp"
          export TMP="/tmp/deps-tmp"
          export TEMP="/tmp/deps-tmp"
          export GITHUB_WORKSPACE_POSIX=$(cygpath -u "$GITHUB_WORKSPACE")
          
          cd "$GITHUB_WORKSPACE_POSIX"
          rm -rf third-party/build-deps/build
