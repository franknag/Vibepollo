name: Generate Windows Release

on:
  push:
    branches: [ ApolloVibeMerged ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build ApolloVibe Custom (Windows x64)
    runs-on: windows-latest
    
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout Repository with Submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up MSYS2 Environment & Dependencies
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          path-type: inherit
          install: >-
            git
            make
            msys/make
            base-devel
            pkg-config
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-x264
            mingw-w64-ucrt-x86_64-git
            mingw-w64-ucrt-x86_64-make
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-openssl
            mingw-w64-ucrt-x86_64-boost
            mingw-w64-ucrt-x86_64-opus
            mingw-w64-ucrt-x86_64-ffmpeg
            mingw-w64-ucrt-x86_64-miniupnpc
            mingw-w64-ucrt-x86_64-cppwinrt
            mingw-w64-ucrt-x86_64-curl-winssl
            mingw-w64-ucrt-x86_64-qt6-static
            mingw-w64-ucrt-x86_64-MinHook
            mingw-w64-ucrt-x86_64-nodejs
            mingw-w64-ucrt-x86_64-nasm
            mingw-w64-ucrt-x86_64-yasm
            mingw-w64-ucrt-x86_64-libvpl
            mingw-w64-ucrt-x86_64-svt-av1
            mingw-w64-ucrt-x86_64-amf-headers
            mingw-w64-ucrt-x86_64-ffnvcodec-headers
            mingw-w64-ucrt-x86_64-python

      - name: Explicitly Initialize and Fix Nested Submodules (LizardByte Build-Deps)
        shell: msys2 {0}
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
          git submodule update --init --recursive --force --verbose
          if [ -d "third-party/build-deps" ]; then
            cd third-party/build-deps
            git submodule update --init --recursive --force --verbose
            
            if [ -d ".git" ]; then
              mkdir -p .git/modules/third-party/FFmpeg/x264/info
              if [ -f ".gitattributes" ]; then
                cp .gitattributes .git/modules/third-party/FFmpeg/x264/info/attributes
              fi
            fi
            
            if [ -d "third-party/FFmpeg/x264" ]; then
              cd third-party/FFmpeg/x264
              git checkout --force HEAD -- .
              git clean -fdx
            fi
          fi

      - name: Sanitize MSYS2 Environment Paths
        shell: pwsh
        run: |
          $envPath = [Environment]::GetEnvironmentVariable("PATH", "Process")
          $cleanedPath = $envPath -replace 'msys64\\msys64', 'msys64' -replace 'msys64/msys64', 'msys64'
          [Environment]::SetEnvironmentVariable("PATH", $cleanedPath, "Process")
          Write-Host "Successfully sanitized PATH environment variable."

      - name: Ensure NPM CLI Path Compatibility for CMake
        shell: pwsh
        run: |
          $targetDir = "C:/msys64/ucrt64/lib/node_modules/npm/bin"
          if (-not (Test-Path $targetDir)) {
              New-Item -ItemType Directory -Force -Path $targetDir | Out-Null
          }
          $found = Get-ChildItem -Path "C:\", "D:\" -Filter "npm-cli.js" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($found) {
              Write-Host "Copying npm-cli.js from $($found.FullName) to $targetDir"
              Copy-Item -Path $found.FullName -Destination "$targetDir/npm-cli.js" -Force
          } else {
              Write-Warning "npm-cli.js source not found yet; creating placeholder structure."
              Set-Content -Path "$targetDir/npm-cli.js" -Value ""
          }

      - name: Build Dependencies Locally & Stage via Python (Bypassing Fragile Install)
        shell: msys2 {0}
        env:
          MSYS2_PATH_TYPE: inherit
        run: |
          export PATH="/ucrt64/bin:/usr/bin:/bin:$PATH"
          export PKG_CONFIG="/ucrt64/bin/pkg-config"
          export PKG_CONFIG_PATH="$(cygpath -u /ucrt64/lib/pkgconfig):$(cygpath -u /ucrt64/share/pkgconfig)"
          
          export CC=/ucrt64/bin/gcc.exe
          export CXX=/ucrt64/bin/g++.exe
          export AR=/ucrt64/bin/ar.exe
          export RANLIB=/usr/bin/ranlib.exe
          export MAKE=/usr/bin/make
          
          mkdir -p /tmp
          export TMPDIR="/tmp"
          export TMP="/tmp"
          export TEMP="/tmp"
          export GITHUB_WORKSPACE_POSIX=$(cygpath -u "$GITHUB_WORKSPACE")
          
          cd "$GITHUB_WORKSPACE_POSIX"
          rm -rf third-party/build-deps/build
          mkdir -p third-party/build-deps/build
          mkdir -p third-party/build-deps/dist/Windows-AMD64
          
          cmake -S third-party/build-deps -B third-party/build-deps/build \
          -G "MSYS Makefiles" \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_INSTALL_PREFIX="$(cygpath -m "$GITHUB_WORKSPACE/third-party/build-deps/dist/Windows-AMD64")" \
          -DCMAKE_PREFIX_PATH="/ucrt64" \
          -DCMAKE_C_COMPILER=/ucrt64/bin/gcc.exe \
          -DCMAKE_CXX_COMPILER=/ucrt64/bin/g++.exe \
          -DCMAKE_AR=/ucrt64/bin/ar.exe \
          -DCMAKE_RANLIB=/usr/bin/ranlib.exe \
          -DBUILD_FFMPEG_SVT_AV1=ON \
          -DMSYS2_OPTION=3
          
          cmake --build third-party/build-deps/build --config Release

          # Comprehensive Python Staging & Header Sync Script
          python3 -c "
          import os, shutil, pathlib

          workspace = pathlib.Path(os.environ.get('GITHUB_WORKSPACE', '.'))
          dist_dir = workspace / 'third-party' / 'build-deps' / 'dist' / 'Windows-AMD64'
          dist_lib = dist_dir / 'lib'
          dist_inc = dist_dir / 'include'
          build_dir = workspace / 'third-party' / 'build-deps' / 'build'
          ffmpeg_src = workspace / 'third-party' / 'build-deps' / 'third-party' / 'FFmpeg'

          dist_lib.mkdir(parents=True, exist_ok=True)
          dist_inc.mkdir(parents=True, exist_ok=True)

          print('1. Staging compiled static libraries (.a)...')
          for p in build_dir.rglob('*.a'):
              try:
                  shutil.copy2(p, dist_lib / p.name)
              except Exception:
                  pass

          print('2. Harvesting public & private FFmpeg source headers (cbs_h264.h, mathops.h, asm.h)...')
          libs = ['libavcodec', 'libavutil', 'libavformat', 'libswscale', 'libswresample', 'libavdevice', 'libavfilter']
          if ffmpeg_src.is_dir():
              for lib in libs:
                  src_lib = ffmpeg_src / lib
                  dst_lib = dist_inc / lib
                  if src_lib.is_dir():
                      dst_lib.mkdir(parents=True, exist_ok=True)
                      for p in src_lib.rglob('*.h'):
                          rel = p.relative_to(src_lib)
                          dest_p = dst_lib / rel
                          dest_p.parent.mkdir(parents=True, exist_ok=True)
                          try:
                              shutil.copy2(p, dest_p)
                          except Exception:
                              pass

          print('3. Copying generated headers from build tree...')
          if build_dir.is_dir():
              for p in build_dir.rglob('*.h'):
                  for lib in libs:
                      if lib in p.parts:
                          dst_lib = dist_inc / lib
                          dst_lib.mkdir(parents=True, exist_ok=True)
                          try:
                              shutil.copy2(p, dst_lib / p.name)
                          except Exception:
                              pass

          print('4. Deep-mirroring libavutil everywhere (fixing asm.h lookups)...')
          avutil_dir = dist_inc / 'libavutil'
          if avutil_dir.is_dir():
              all_dirs = [dist_inc] + [p for p in dist_inc.rglob('*') if p.is_dir()]
              for d in all_dirs:
                  avutil_target = d / 'libavutil'
                  avutil_target.mkdir(parents=True, exist_ok=True)
                  for p in avutil_dir.rglob('*.h'):
                      rel = p.relative_to(avutil_dir)
                      dest_p = avutil_target / rel
                      dest_p.parent.mkdir(parents=True, exist_ok=True)
                      if p.resolve() != dest_p.resolve():
                          try:
                              shutil.copy2(p, dest_p)
                          except Exception:
                              pass

          print('5. Universal propagation of config.h and avconfig.h everywhere...')
          if build_dir.is_dir():
              config_files = list(build_dir.rglob('config.h')) + list(build_dir.rglob('avconfig.h'))
              for cfg in config_files:
                  if cfg.is_file():
                      for d in [dist_inc] + [p for p in dist_inc.rglob('*') if p.is_dir()]:
                          target_cfg = d / cfg.name
                          try:
                              shutil.copy2(cfg, target_cfg)
                          except Exception:
                              pass

          print('Python staging and configuration propagation completed successfully.')
          "

      - name: Configure CMake Build
        shell: msys2 {0}
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Compile ApolloVibe (Sunshine Host)
        shell: msys2 {0}
        run: |
          cd build
          ninja -j2 sunshine

      - name: Package Windows Artifacts & Generate Checksums
        shell: pwsh
        run: |
          $distDir = "dist/apollovibe-windows-x64"
          if (Test-Path "dist") { Remove-Item -Recurse -Force "dist" }
          New-Item -ItemType Directory -Force -Path $distDir | Out-Null
          
          if (Test-Path "build/sunshine.exe") { Copy-Item "build/sunshine.exe" -Destination "$distDir/" -Force }
          if (Test-Path "assets") { Copy-Item -Recurse -Force "assets" -Destination "$distDir/" }
          if (Test-Path "tools") { Copy-Item -Recurse -Force "tools" -Destination "$distDir/" }
          
          if (Test-Path "apollovibe-windows-x64.zip") { Remove-Item "apollovibe-windows-x64.zip" }
          Compress-Archive -Path "$distDir" -DestinationPath "apollovibe-windows-x64.zip"
          
          $hashObj = Get-FileHash -Path "apollovibe-windows-x64.zip" -Algorithm SHA256
          $hashStr = $hashObj.Hash.ToLower()
          "$hashStr  apollovibe-windows-x64.zip" | Out-File -Encoding ascii "apollovibe-windows-x64.zip.sha256"
          
          Write-Host "--- Generated Checksum ---"
          Get-Content "apollovibe-windows-x64.zip.sha256"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: apollovibe-windows-x64-release
          path: |
            apollovibe-windows-x64.zip
            apollovibe-windows-x64.zip.sha256
